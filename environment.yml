name: chicken_spoilage_ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.2
  - pip
  # Data handling
  - pandas=2.3.3
  - numpy=1.26.4
  - openpyxl=3.1.5
  # Statistics
  - scipy=1.16.3
  - statsmodels=0.14.2
  # Machine learning
  - scikit-learn=1.8.0
  # Visualisation
  - matplotlib=3.10.8
  - seaborn=0.13.2
  # Jupyter
  - jupyterlab>=4.0
  - ipykernel
  - pip:
    - optuna==4.3.0
    - shap==0.48.0
    - lightgbm==4.6.0
    - xgboost==3.0.2
    - tensorflow==2.16.2
    - plotly==5.24.1
